<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILLED WITH LOVE</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-sub: #666666;
            --border-color: #e5e5e5;
            --font-stack: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-stack); background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; font-size: 14px; }
        
        /* 【修改点】自适应容器宽度 */
        .container { 
            width: 95%; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }
        .brand { font-weight: 700; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; color: var(--text-sub); transition: color 0.2s; }
        .nav-item:hover, .nav-item.active { color: var(--text-main); font-weight: 600; }
        
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 11px; text-transform: uppercase; border: 1px solid var(--border-color); padding: 4px 10px; }
        .avatar-small { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #eee; }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Forms */
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 0; font-family: var(--font-stack); font-size: 13px; outline: none; }
        input:focus, textarea:focus { border-color: var(--text-main); }
        button { background-color: var(--text-main); color: white; border: none; padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        button:hover { opacity: 0.8; }
        button.secondary { background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        
        /* Posts & Items */
        .card { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); position: relative; }
        
        /* 【修改点】帖子头部包含头像 */
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #f0f0f0; border: 1px solid #eee; }
        
        .card-meta { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
        .card-content { font-size: 14px; color: #333; white-space: pre-wrap; margin-bottom: 15px; }
        
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 5px; margin-top: 10px; }
        .image-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid #eee; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f9f9f9; flex-wrap: wrap; gap: 10px; }
        .text-btn { background: none; border: none; color: var(--text-sub); font-size: 11px; text-transform: uppercase; cursor: pointer; padding: 0; }
        .text-btn:hover { color: var(--text-main); text-decoration: underline; }
        .delete-btn:hover { color: red; }
        .like-btn { display: flex; align-items: center; gap: 4px; }

        /* Edit Mode */
        .edit-mode { display: none; margin-top: 10px; }
        .edit-mode.active { display: block; }
        .view-mode.hidden { display: none; }

        /* Comments */
        .comments-area { display: none; margin-top: 15px; padding-left: 15px; border-left: 2px solid #eee; }
        .comments-area.active { display: block; }
        .comment { font-size: 12px; margin-bottom: 5px; color: var(--text-sub); }
        .comment strong { color: var(--text-main); font-weight: 600; text-transform: uppercase; font-size: 10px; margin-right: 5px; }

        /* Image Upload Preview */
        .upload-preview { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .preview-item { position: relative; width: 60px; height: 60px; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #ccc; }
        .preview-remove { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 15px; height: 15px; text-align: center; line-height: 15px; font-size: 10px; cursor: pointer; }

        /* Auth Modal */
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { width: 300px; max-width: 90%; padding: 40px; border: 1px solid var(--border-color); text-align: center; }
        .hidden { display: none !important; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .nav-links { width: 100%; justify-content: space-between; }
            .user-profile { align-self: flex-end; }
            .image-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2 style="margin-bottom: 20px; text-transform: uppercase;" id="auth-title">Login</h2>
            <input type="text" id="username" placeholder="USERNAME">
            <input type="password" id="password" placeholder="PASSWORD">
            <button id="auth-submit" style="width: 100%;">Sign In</button>
            <div id="auth-error" style="color: red; font-size: 10px; margin-top: 10px;"></div>
            <div class="auth-toggle" id="toggle-auth" style="margin-top:15px; font-size:10px; cursor:pointer; text-decoration:underline;">Create Account</div>
            <div class="auth-toggle" onclick="closeAuth()" style="margin-top:10px; font-size:10px; cursor:pointer; text-decoration:underline;">Close</div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="brand">FILLED WITH LOVE</div>
            <div style="display: flex; align-items: center; gap: 20px; width: 100%; justify-content: space-between;">
                <div class="nav-links">
                    <div class="nav-item" onclick="switchTab('forum')">Posts</div>
                    <div class="nav-item active" onclick="switchTab('story')">CZ's Story</div>
                    <div class="nav-item" onclick="switchTab('kitchen')">Kitchen</div>
                </div>
                <div id="user-display" class="user-profile" onclick="openAuth()">
                    <img src="" class="avatar-small hidden" id="header-avatar">
                    <span id="header-username">Login</span>
                </div>
            </div>
        </header>

        <!-- Tab: Forum -->
        <div id="tab-forum" class="section">
            <div id="create-post-area" class="hidden" style="margin-bottom: 40px; padding: 20px; border: 1px solid var(--border-color);">
                <h3 style="margin-bottom: 15px; text-transform: uppercase; font-size: 11px;">New Post</h3>
                <input type="text" id="new-post-title" placeholder="TITLE">
                <textarea id="new-post-content" rows="4" placeholder="CONTENT"></textarea>
                
                <label style="font-size:10px; text-transform:uppercase; color:#666;">Images (Max 3)</label>
                <input type="file" id="new-post-images" multiple accept="image/*" onchange="handlePostImageSelect(this)">
                <div class="upload-preview" id="post-image-preview"></div>
                
                <button onclick="createPost()">Publish</button>
            </div>
            <div id="posts-container"></div>
        </div>

        <!-- Tab: Story -->
        <div id="tab-story" class="section active">
            <div class="card">
                <div class="card-title">CZ's Little Stories</div>
                <div class="card-content">Static content area...</div>
            </div>
        </div>

        <!-- Tab: Kitchen -->
        <div id="tab-kitchen" class="section">
            <div id="create-kitchen-area" class="hidden" style="margin-bottom: 40px; padding: 20px; border: 1px solid var(--border-color);">
                <h3 style="margin-bottom: 15px; text-transform: uppercase; font-size: 11px;">Add to Kitchen</h3>
                <input type="text" id="kitchen-title" placeholder="TITLE (Required)">
                <input type="text" id="kitchen-link" placeholder="LINK (Optional)">
                
                <label style="font-size:10px; text-transform:uppercase; color:#666;">Images (Max 10)</label>
                <input type="file" id="kitchen-images" multiple accept="image/*" onchange="handleKitchenImageSelect(this)">
                <div class="upload-preview" id="kitchen-image-preview"></div>
                
                <button onclick="createKitchenItem()">Add Item</button>
            </div>
            <div id="kitchen-container"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let sessionId = localStorage.getItem('sessionId');
        let currentUser = localStorage.getItem('username');
        let currentUserId = localStorage.getItem('userId');
        let userAvatar = localStorage.getItem('userAvatar');
        let isLoginMode = true;

        let postFiles = [];
        let kitchenFiles = [];

        function init() {
            updateUI();
            loadPosts();
            loadKitchen();
            switchTab('story');
        }

        function updateUI() {
            const usernameEl = document.getElementById('header-username');
            const avatarEl = document.getElementById('header-avatar');
            const createPostArea = document.getElementById('create-post-area');
            const createKitchenArea = document.getElementById('create-kitchen-area');
            
            if (sessionId && currentUser) {
                usernameEl.innerText = currentUser;
                createPostArea.classList.remove('hidden');
                createKitchenArea.classList.remove('hidden');
                
                if (userAvatar) {
                    avatarEl.src = API_URL + userAvatar;
                    avatarEl.classList.remove('hidden');
                } else {
                    avatarEl.classList.add('hidden');
                }
            } else {
                usernameEl.innerText = 'Login';
                createPostArea.classList.add('hidden');
                createKitchenArea.classList.add('hidden');
                avatarEl.classList.add('hidden');
            }
        }

        window.switchTab = function(tabName) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            const navItems = document.querySelectorAll('.nav-item');
            if(tabName === 'forum') navItems[0].classList.add('active');
            if(tabName === 'story') navItems[1].classList.add('active');
            if(tabName === 'kitchen') navItems[2].classList.add('active');
        }

        // --- Auth & Avatar ---
        window.openAuth = function() {
            if (sessionId) {
                const action = confirm("Click OK to Upload Avatar, Cancel to Logout");
                if (action) {
                    triggerAvatarUpload();
                } else {
                    logout();
                }
            } else {
                document.getElementById('auth-modal').style.display = 'flex';
            }
        }
        
        function triggerAvatarUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const formData = new FormData();
                formData.append('avatar', file);
                formData.append('sessionId', sessionId);
                
                try {
                    const res = await fetch(`${API_URL}/me/avatar`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok) {
                        userAvatar = data.avatar;
                        localStorage.setItem('userAvatar', userAvatar);
                        updateUI();
                        alert('Avatar updated!');
                    } else {
                        alert(data.message);
                    }
                } catch (err) {
                    console.error(err);
                }
            };
            input.click();
        }

        window.closeAuth = function() { document.getElementById('auth-modal').style.display = 'none'; }
        
        document.getElementById('toggle-auth').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Login' : 'Register';
            document.getElementById('auth-submit').innerText = isLoginMode ? 'Sign In' : 'Sign Up';
            document.getElementById('toggle-auth').innerText = isLoginMode ? 'Create Account' : 'Back to Login';
            document.getElementById('auth-error').innerText = '';
        });

        document.getElementById('auth-submit').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (!username || !password) return;

            try {
                const res = await fetch(`${API_URL}/${isLoginMode ? 'login' : 'register'}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);

                if (isLoginMode) {
                    sessionId = data.sessionId;
                    currentUser = data.username;
                    currentUserId = data.userId;
                    
                    const meRes = await fetch(`${API_URL}/me`, {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ sessionId })
                    });
                    const meData = await meRes.json();
                    userAvatar = meData.avatar;

                    localStorage.setItem('sessionId', sessionId);
                    localStorage.setItem('username', currentUser);
                    localStorage.setItem('userId', String(currentUserId));
                    localStorage.setItem('userAvatar', userAvatar || '');
                    
                    closeAuth();
                    updateUI();
                    loadPosts();
                    loadKitchen();
                } else {
                    alert('Registered! Please login.');
                    isLoginMode = true;
                    document.getElementById('toggle-auth').click();
                }
            } catch (err) {
                document.getElementById('auth-error').innerText = err.message;
            }
        });

        function logout() {
            localStorage.clear();
            window.location.reload();
        }

        // --- Image Handling Helpers ---
        function handlePostImageSelect(input) {
            const files = Array.from(input.files);
            if (postFiles.length + files.length > 3) {
                alert('Max 3 images allowed');
                return;
            }
            postFiles = [...postFiles, ...files];
            renderPostPreviews();
            input.value = '';
        }

        function renderPostPreviews() {
            const container = document.getElementById('post-image-preview');
            container.innerHTML = '';
            postFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}">
                        <div class="preview-remove" onclick="removePostImage(${index})">×</div>
                    `;
                    container.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removePostImage = function(index) {
            postFiles.splice(index, 1);
            renderPostPreviews();
        }

        function handleKitchenImageSelect(input) {
            const files = Array.from(input.files);
            if (kitchenFiles.length + files.length > 10) {
                alert('Max 10 images allowed');
                return;
            }
            kitchenFiles = [...kitchenFiles, ...files];
            renderKitchenPreviews();
            input.value = '';
        }

        function renderKitchenPreviews() {
            const container = document.getElementById('kitchen-image-preview');
            container.innerHTML = '';
            kitchenFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}">
                        <div class="preview-remove" onclick="removeKitchenImage(${index})">×</div>
                    `;
                    container.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeKitchenImage = function(index) {
            kitchenFiles.splice(index, 1);
            renderKitchenPreviews();
        }

        // --- Posts Logic (With Likes, Comments, Edit, Avatar) ---
        async function loadPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`);
                const posts = await res.json();
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                for (const post of posts) {
                    const isOwner = currentUserId && (Number(post.user_id) === Number(currentUserId));
                    
                    let imagesHtml = '';
                    if (post.images) {
                        try {
                            const imgs = JSON.parse(post.images);
                            if (imgs && imgs.length > 0) {
                                imagesHtml = `<div class="image-grid">${imgs.map(src => `<img src="${API_URL}${src}">`).join('')}</div>`;
                            }
                        } catch(e) {}
                    }

                    let likeCount = 0;
                    try {
                        const likeRes = await fetch(`${API_URL}/posts/${post.id}/likes`);
                        const likeData = await likeRes.json();
                        likeCount = likeData.count;
                    } catch(e) {}

                    // 【修改点】处理头像显示，如果没有头像则使用默认占位符
                    const avatarSrc = post.avatar ? `${API_URL}${post.avatar}` : '';
                    const avatarImg = avatarSrc ? `<img src="${avatarSrc}" class="post-avatar">` : `<div class="post-avatar" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;">${post.username.charAt(0).toUpperCase()}</div>`;

                    const div = document.createElement('div');
                    div.className = 'card';
                    div.id = `post-${post.id}`;
                    div.innerHTML = `
                        <div class="card-header">
                            ${avatarImg}
                            <div class="card-meta">
                                <span>${post.username} &mdash; ${new Date(post.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                        
                        <div class="view-mode">
                            <div class="card-title">${escapeHtml(post.title)}</div>
                            <div class="card-content">${escapeHtml(post.content)}</div>
                            ${imagesHtml}
                        </div>

                        <div class="edit-mode">
                            <input type="text" class="edit-title" value="${escapeHtml(post.title)}">
                            <textarea class="edit-content" rows="4">${escapeHtml(post.content)}</textarea>
                            <label style="font-size:10px;">Replace Images (Max 3)</label>
                            <input type="file" class="edit-images" multiple accept="image/*">
                            <div style="margin-top:10px;">
                                <button onclick="saveEdit(${post.id})">Save</button>
                                <button class="secondary" onclick="cancelEdit(${post.id})">Cancel</button>
                            </div>
                        </div>

                        <div class="action-bar">
                            <div style="display:flex; gap:15px; align-items:center;">
                                <button class="text-btn" onclick="toggleComments(${post.id})">Comments</button>
                                <button class="text-btn like-btn" onclick="toggleLike(${post.id}, this)">
                                    ❤ <span class="like-count">${likeCount}</span>
                                </button>
                            </div>
                            <div>
                                ${isOwner ? `
                                    <button class="text-btn edit-btn" onclick="enableEdit(${post.id})">Edit</button>
                                    <button class="text-btn delete-btn" onclick="deletePost(${post.id})">Delete</button>
                                ` : ''}
                            </div>
                        </div>

                        <div id="comments-${post.id}" class="comments-area">
                            <div id="comments-list-${post.id}"></div>
                            ${sessionId ? `
                                <div style="margin-top:10px; display:flex;">
                                    <input type="text" id="comment-input-${post.id}" placeholder="Write a comment..." style="margin-bottom:0;">
                                    <button onclick="addComment(${post.id})" style="padding:0 10px; margin-left:5px;">Send</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    container.appendChild(div);
                }
            } catch (err) { console.error(err); }
        }

        async function toggleLike(postId, btnElement) {
            if (!sessionId) return alert('Please login to like');
            try {
                let res = await fetch(`${API_URL}/posts/${postId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });

                if (!res.ok) {
                    const data = await res.json();
                    if (data.message === 'Already liked') {
                        res = await fetch(`${API_URL}/posts/${postId}/like`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sessionId })
                        });
                    }
                }

                const likeRes = await fetch(`${API_URL}/posts/${postId}/likes`);
                const likeData = await likeRes.json();
                btnElement.querySelector('.like-count').innerText = likeData.count;
                
            } catch (err) { console.error(err); }
        }

        window.enableEdit = function(id) {
            const postEl = document.getElementById(`post-${id}`);
            postEl.querySelector('.view-mode').classList.add('hidden');
            postEl.querySelector('.edit-mode').classList.add('active');
        }

        window.cancelEdit = function(id) {
            const postEl = document.getElementById(`post-${id}`);
            postEl.querySelector('.view-mode').classList.remove('hidden');
            postEl.querySelector('.edit-mode').classList.remove('active');
        }

        window.saveEdit = async function(id) {
            const postEl = document.getElementById(`post-${id}`);
            const title = postEl.querySelector('.edit-title').value;
            const content = postEl.querySelector('.edit-content').value;
            const fileInput = postEl.querySelector('.edit-images');
            
            const formData = new FormData();
            formData.append('sessionId', sessionId);
            formData.append('title', title);
            formData.append('content', content);
            
            if (fileInput.files.length > 0) {
                Array.from(fileInput.files).forEach(file => {
                    formData.append('images', file);
                });
            }

            try {
                const res = await fetch(`${API_URL}/posts/${id}`, {
                    method: 'PUT',
                    body: formData
                });
                if (res.ok) {
                    loadPosts();
                } else {
                    alert((await res.json()).message);
                }
            } catch (err) { console.error(err); }
        }

        async function createPost() {
            const title = document.getElementById('new-post-title').value;
            const content = document.getElementById('new-post-content').value;
            if (!title || !content) return alert('Fill all fields');

            const formData = new FormData();
            formData.append('sessionId', sessionId);
            formData.append('title', title);
            formData.append('content', content);
            postFiles.forEach(file => {
                formData.append('images', file);
            });

            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                     document.getElementById('new-post-title').value = '';
                     document.getElementById('new-post-content').value = '';
                     postFiles = [];
                     renderPostPreviews();

                    await loadPosts();
                    switchTab('forum');
                } else {
                    alert((await res.json()).message);
                }
            } catch (err) { console.error(err); }
        }

        async function deletePost(id) {
            if (!confirm('Delete?')) return;
            try {
                const res = await fetch(`${API_URL}/posts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                if (res.ok) loadPosts();
                else alert((await res.json()).message);
            } catch (err) { console.error(err); }
        }

        // --- Comments Logic ---
        window.toggleComments = async function(postId) {
            const area = document.getElementById(`comments-${postId}`);
            if (area.classList.contains('active')) {
                area.classList.remove('active');
            } else {
                area.classList.add('active');
                const res = await fetch(`${API_URL}/posts/${postId}/comments`);
                const comments = await res.json();
                document.getElementById(`comments-list-${postId}`).innerHTML = comments.map(c => `
                    <div class="comment">
                        <strong>${c.username}:</strong> ${escapeHtml(c.content)}
                        ${currentUserId && Number(c.user_id) === Number(currentUserId) ? 
                            `<span style="color:red; cursor:pointer; margin-left:5px;" onclick="deleteComment(${c.id}, ${postId})">×</span>` : ''}
                    </div>
                `).join('');
            }
        }

        window.addComment = async function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input.value) return;
            try {
                const res = await fetch(`${API_URL}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, postId, content: input.value })
                });
                if (res.ok) {
                    input.value = '';
                    toggleComments(postId);
                }
            } catch (err) { console.error(err); }
        }

        window.deleteComment = async function(commentId, postId) {
            if(!confirm('Delete comment?')) return;
            try {
                const res = await fetch(`${API_URL}/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                if (res.ok) toggleComments(postId);
            } catch (err) { console.error(err); }
        }

        // --- Kitchen Logic ---
        async function loadKitchen() {
            try {
                const res = await fetch(`${API_URL}/kitchen`);
                const items = await res.json();
                const container = document.getElementById('kitchen-container');
                container.innerHTML = '';

                for (const item of items) {
                    const isOwner = currentUserId && (Number(item.user_id) === Number(currentUserId));
                    let imagesHtml = '';
                    if (item.images && item.images.length > 0) {
                        imagesHtml = `<div class="image-grid">${item.images.map(src => `<img src="${API_URL}${src}">`).join('')}</div>`;
                    }
                    
                    let linkHtml = item.link ? `<a href="${item.link}" target="_blank" style="font-size:11px; color:#666; text-decoration:underline;">${item.link}</a>` : '';

                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div class="card-meta">
                            <span>${item.username}</span>
                            ${isOwner ? `<button class="text-btn delete-btn" onclick="deleteKitchenItem(${item.id})">Delete</button>` : ''}
                        </div>
                        <div class="card-title">${escapeHtml(item.title)}</div>
                        ${linkHtml}
                        ${imagesHtml}
                    `;
                    container.appendChild(div);
                }
            } catch (err) { console.error(err); }
        }

        async function createKitchenItem() {
            const title = document.getElementById('kitchen-title').value;
            const link = document.getElementById('kitchen-link').value;
            if (!title) return alert('Title required');

            const formData = new FormData();
            formData.append('sessionId', sessionId);
            formData.append('title', title);
            formData.append('link', link);
            kitchenFiles.forEach(file => {
                formData.append('images', file);
            });

            try {
                const res = await fetch(`${API_URL}/kitchen`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    document.getElementById('kitchen-title').value = '';
                    document.getElementById('kitchen-link').value = '';
                    kitchenFiles = [];
                    renderKitchenPreviews();
                    loadKitchen();
                } else {
                    alert((await res.json()).message);
                }
            } catch (err) { console.error(err); }
        }

        async function deleteKitchenItem(id) {
            if (!confirm('Delete this item?')) return;
            try {
                const res = await fetch(`${API_URL}/kitchen/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                if (res.ok) loadKitchen();
                else alert((await res.json()).message);
            } catch (err) { console.error(err); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        init();
    </script>
</body>
</html>
